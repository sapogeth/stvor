app = 'stvor-relay'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"
  build-target = "runner"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  STORAGE_TYPE = "memory"
  LOG_LEVEL = "info"